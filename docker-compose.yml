# ---------------------------------------------------------------------------
# SocialBotGuard - orquestacion local de desarrollo
# ---------------------------------------------------------------------------
# Uso rapido:  docker compose up --build      -> http://localhost:8000
#
# Notas para Windows (Docker Desktop):
#   - El bind-mount de ./ es correcto pero mas lento que un volume nombrado
#     (limites de ficheros del host). Si notas latencia, comenta el bloque
#     `volumes` y reinicia el contenedor para trabajar con la copia de la imagen.
#   - `develop.watch` requiere Compose v2.22+. Si tu version es anterior,
#     dejalo desactivado: el `--reload` del comando ya cubre el hot-reload.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-assembly:2.0.0
    container_name: socialbotguard-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      APP_ENV: development
      PORT: "8000"
      APP_NAME: SocialBotGuard
      APP_VERSION: "2.0.0"

    volumes:
      # Hot-reload del codigo + templates en desarrollo.
      - ./:/app

    command: >
      uvicorn app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app
      --reload-include *.py
      --reload-include *.html

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Limite de recursos: el simulador es ligero, pero acota el contenedor.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
