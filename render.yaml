# ---------------------------------------------------------------------------
# SocialBotGuard - blueprint de despliegue en Render
# ---------------------------------------------------------------------------
# Uso:  push a GitHub -> New -> Blueprint -> apuntar a este repositorio.
# Render lee este fichero y crea el web service sin configuracion manual.
#
# No hace falta ninguna clave secreta: la app es un simulador autocontenido
# (el estado vive en memoria y no se conecta a APIs externas).
# ---------------------------------------------------------------------------
services:
  - type: web
    name: socialbotguard
    runtime: python
    plan: free
    region: oregon
    languageVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    # `python app.py` lee $PORT y activa --proxy-headers (obligatorio detras
    # del proxy de Render, tambien para las conexiones WebSocket).
    startCommand: python app.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: SocialBotGuard
      - key: APP_VERSION
        value: "2.0.0"
